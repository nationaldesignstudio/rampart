name: Release

# Publishes Rampart to npm and Hugging Face.
#
# Triggers on a *published* GitHub Release (cut a release whose tag matches the
# version in package.json). `workflow_dispatch` runs the same pipeline but
# defaults to a dry run so you can rehearse without shipping.
#
# Required repository secrets:
#   NPM_TOKEN  — npm automation token with publish rights to @nationaldesignstudio
#   HF_TOKEN   — Hugging Face write token for nationaldesignstudio/rampart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and build without publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify before release
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify public package
        run: bun run verify:public

      - name: Verify npm package contents
        run: npm pack --dry-run --cache /tmp/npm-cache-rampart

  npm:
    name: Publish to npm
    needs: verify
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        # prepack builds dist/, prepublishOnly re-runs verify:public.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — npm publish --dry-run"
            npm publish --dry-run --access restricted
          else
            npm publish --access restricted
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  huggingface:
    name: Publish to Hugging Face
    needs: verify
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: pip install --upgrade "huggingface_hub[cli]"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify Hugging Face export
        run: bun run export:huggingface:verify

      - name: Upload to Hugging Face
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          hf repo create nationaldesignstudio/rampart --repo-type model --private --exist-ok
          hf upload nationaldesignstudio/rampart hf-export . \
            --repo-type model \
            --commit-message "Release ${{ github.event.release.tag_name || github.sha }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  coreml:
    name: Publish Core ML artifact
    needs: verify
    if: github.repository == 'nationaldesignstudio/rampart'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/tokenizer_config.json,model/special_tokens_map.json,model/vocab.txt,model/config.json" --exclude=""

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversion dependencies
        run: python -m pip install -r apple/RampartCoreML/requirements-convert.txt

      - name: Copy release model files
        run: |
          mkdir -p apple/RampartCoreML/artifacts/rampart-hf
          cp model/onnx/model_q4.onnx apple/RampartCoreML/artifacts/rampart-hf/model_q4.onnx
          cp model/config.json apple/RampartCoreML/artifacts/rampart-hf/config.json
          cp model/tokenizer.json apple/RampartCoreML/artifacts/rampart-hf/tokenizer.json
          cp model/tokenizer_config.json apple/RampartCoreML/artifacts/rampart-hf/tokenizer_config.json
          cp model/special_tokens_map.json apple/RampartCoreML/artifacts/rampart-hf/special_tokens_map.json
          cp model/vocab.txt apple/RampartCoreML/artifacts/rampart-hf/vocab.txt

      - name: Convert ONNX to Core ML
        working-directory: apple/RampartCoreML
        run: python scripts/convert_rampart_to_coreml.py

      - name: Validate Core ML parity
        working-directory: apple/RampartCoreML
        run: python scripts/validate_coreml_parity.py

      - name: Run Swift package tests with model artifacts
        run: swift test

      - name: Build iOS example
        run: |
          xcodebuild \
            -project apple/RampartCoreML/Examples/RampartExampleiOS/RampartExampleiOS.xcodeproj \
            -scheme RampartExampleiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Package Core ML runtime artifacts
        run: |
          cd apple/RampartCoreML
          mkdir -p artifacts/legal
          cp LICENSE artifacts/legal/LICENSE
          cp NOTICE.md artifacts/legal/NOTICE.md
          zip -qry ../../rampart-coreml-artifacts.zip \
            artifacts/RampartTokenClassifier.mlpackage \
            artifacts/rampart-hf/vocab.txt \
            artifacts/rampart-hf/config.json \
            artifacts/legal/LICENSE \
            artifacts/legal/NOTICE.md
          cd ../..
          shasum -a 256 rampart-coreml-artifacts.zip > rampart-coreml-artifacts.zip.sha256

      - name: Upload Core ML release artifact
        if: ${{ github.event_name == 'release' && inputs.dry_run != 'true' }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            rampart-coreml-artifacts.zip \
            rampart-coreml-artifacts.zip.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
