name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Rampart
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch model artifacts
        run: |
          git lfs install --local
          git lfs pull --include="model/onnx/model_q4.onnx,model/tokenizer.json,model/vocab.txt" --exclude=""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify public package
        run: bun run verify:public

      - name: Verify npm package contents
        run: npm pack --dry-run --cache /tmp/npm-cache-rampart

  swift:
    name: Verify RampartCoreML
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Fetch tokenizer vocabulary
        run: |
          git lfs install --local
          git lfs pull --include="model/vocab.txt" --exclude=""

      - name: Run Swift package tests
        run: swift test
